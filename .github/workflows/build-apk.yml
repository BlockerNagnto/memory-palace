name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 1) 單元測試：空間引擎、儲存層、選取數學。失敗就不打包。
      - name: Unit tests
        run: node --test

      # 2) 組裝網頁資產。Three.js 在這裡從 npm 抓下來，複製進 APK，所以 APK 執行時完全離線。
      - name: Assemble web assets (offline Three.js)
        run: |
          set -e
          mkdir -p build/www/vendor/loaders build/www/vendor/utils
          for f in index.html engine.js store.js pick.js starter.js render.js input.js ui.js main.js; do
            cp "$f" build/www/
          done
          cd build
          npm init -y > /dev/null
          npm install --no-audit --no-fund three@0.160.0 @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          cp node_modules/three/build/three.module.js www/vendor/three.module.js
          cp node_modules/three/examples/jsm/loaders/GLTFLoader.js www/vendor/loaders/
          cp node_modules/three/examples/jsm/loaders/OBJLoader.js www/vendor/loaders/
          cp node_modules/three/examples/jsm/utils/BufferGeometryUtils.js www/vendor/utils/
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "app.memorypalace.offline",
            "appName": "記憶宮殿",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          JSON
          ls -la www www/vendor

      # 3) 用真實 Three.js 在瀏覽器裡跑一遍完整操作並截圖（不通過也會繼續打包，結果寫在摘要裡）
      - name: Browser smoke test (real Three.js)
        id: smoke
        continue-on-error: true
        run: |
          set -e
          mkdir -p smoke && cp smoke.mjs smoke/ && cd smoke
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          node smoke.mjs ../build/www --shots ../shots 2>&1 | tee ../smoke.log

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: |
            shots
            smoke.log
          if-no-files-found: ignore

      # 4) 產生 Android 專案並編譯
      - name: Build Android project
        working-directory: build
        run: |
          set -e
          npx cap add android
          npx cap sync android
          STYLES=android/app/src/main/res/values/styles.xml
          sed -i 's#<style name="AppTheme.NoActionBar"[^>]*>#&\n        <item name="android:windowFullscreen">true</item>#' "$STYLES"
          grep -q windowFullscreen "$STYLES" || { echo "全螢幕設定未寫入 styles.xml"; cat "$STYLES"; exit 1; }
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../memory-palace.apk

      # 5) 驗證 APK 內確實帶有離線資產
      - name: Verify APK contents
        run: |
          set -e
          unzip -l memory-palace.apk > apk.txt
          for p in assets/public/index.html assets/public/main.js assets/public/engine.js assets/public/vendor/three.module.js; do
            grep -q "$p" apk.txt || { echo "APK 缺少 $p"; exit 1; }
          done
          ls -la memory-palace.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: memory-palace-apk
          path: memory-palace.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 記憶宮殿 build ${{ github.run_number }}
          files: memory-palace.apk
          prerelease: true

      - name: Summary
        if: always()
        run: |
          {
            echo "## 建置結果"
            echo "- 單元測試：通過（否則不會走到這裡）"
            echo "- 真實 Three.js 瀏覽器測試：${{ steps.smoke.outcome }}"
            echo "- APK：到本次執行下方 Artifacts 下載 memory-palace-apk，或到 Releases 直接點 memory-palace.apk"
          } >> "$GITHUB_STEP_SUMMARY"
