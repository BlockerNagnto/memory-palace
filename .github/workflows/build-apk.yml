name: build-apk

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  GODOT_MM: "4.4"          # 主.次版本；同時決定下載網址與編輯器設定檔名稱
  GODOT_CHANNEL: "stable"

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 安裝 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 下載 Godot Headless 與 Android 匯出範本
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_MM}-${GODOT_CHANNEL}"
          NAME="Godot_v${GODOT_MM}-${GODOT_CHANNEL}"
          mkdir -p "$HOME/godot-bin"
          cd "$HOME/godot-bin"
          wget -q "${BASE}/${NAME}_linux.x86_64.zip"
          wget -q "${BASE}/${NAME}_export_templates.tpz"
          unzip -q "${NAME}_linux.x86_64.zip"
          mv "${NAME}_linux.x86_64" godot
          chmod +x godot
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_MM}.${GODOT_CHANNEL}"
          mkdir -p "$TEMPLATE_DIR"
          unzip -q "${NAME}_export_templates.tpz" -d tpz
          mv tpz/templates/* "$TEMPLATE_DIR/"
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: 確認 Godot 版本
        run: godot --version

      - name: 生成 1024x1024 幾何門框 icon.png
        run: |
          python3 - <<'PY'
          import struct, zlib

          W = H = 1024
          BG = (22, 26, 44)
          GOLD = (224, 190, 110)

          canvas = [bytearray(bytes(BG) * W) for _ in range(H)]

          def rect(x0, y0, x1, y1, color):
              chunk = bytes(color) * (x1 - x0)
              for y in range(y0, y1):
                  canvas[y][x0 * 3:x1 * 3] = chunk

          # 地板
          rect(184, 864, 840, 904, GOLD)
          # 門框
          rect(300, 160, 724, 864, GOLD)
          # 門內漸層（傳送門）
          top, bottom = (130, 180, 255), (40, 70, 150)
          for y in range(216, 864):
              t = (y - 216) / (864 - 216)
              color = tuple(int(top[i] + (bottom[i] - top[i]) * t) for i in range(3))
              rect(356, y, 668, y + 1, color)

          def chunk(tag, data):
              body = tag + data
              return struct.pack(">I", len(data)) + body + struct.pack(">I", zlib.crc32(body) & 0xFFFFFFFF)

          raw = b"".join(b"\x00" + bytes(row) for row in canvas)
          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(">IIBBBBB", W, H, 8, 2, 0, 0, 0))
              + chunk(b"IDAT", zlib.compress(raw, 9))
              + chunk(b"IEND", b"")
          )
          with open("icon.png", "wb") as f:
              f.write(png)
          print("icon.png written:", len(png), "bytes")
          PY

      - name: 執行無頭單元測試（失敗即中止）
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/headless_tests.gd 2>&1 | tee test.log
          grep -q "^RESULT: PASS" test.log
          if grep -E "SCRIPT ERROR|Parse Error" test.log; then
            echo "測試輸出含腳本錯誤"
            exit 1
          fi

      # 以下步驟在 scenes/main.tscn 出現後（第 4 批）才會啟用
      - name: 準備 Android SDK 與 Godot 編輯器設定
        if: ${{ hashFiles('scenes/main.tscn') != '' }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.1" "platforms;android-35"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${GODOT_MM}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${SDK}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          keytool -genkey -v -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: 匯出 APK
        if: ${{ hashFiles('scenes/main.tscn') != '' }}
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --import || true
          godot --headless --path . --export-debug "Android" build/memory-palace.apk 2>&1 | tee export.log
          test -s build/memory-palace.apk

      - name: 上傳 APK
        if: ${{ hashFiles('scenes/main.tscn') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: memory-palace-apk
          path: build/memory-palace.apk
          if-no-files-found: error
