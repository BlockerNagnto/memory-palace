<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10121a">
<title>記憶宮殿</title>
<style>
  :root { --bg:#10121a; --panel:#1b1f2c; --panel2:#262b3c; --fg:#eef1f8; --dim:#9aa3bb; --acc:#5ac8a0; --warn:#ff7a6b; --gold:#d4a64a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden; overscroll-behavior:none;
    font:15px/1.45 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif; user-select:none; -webkit-user-select:none; }
  #gl { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #touch { position:fixed; inset:0; touch-action:none; }
  #joyBase { position:fixed; display:none; width:112px; height:112px; border-radius:50%; background:rgba(255,255,255,.10); border:2px solid rgba(255,255,255,.28); pointer-events:none; }
  #joyKnob { position:absolute; left:28px; top:28px; width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,.45); }
  #cross { position:fixed; left:50%; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; pointer-events:none; opacity:.7; }
  #cross::before,#cross::after { content:""; position:absolute; background:#fff; }
  #cross::before { left:6px; top:0; width:2px; height:14px; } #cross::after { top:6px; left:0; height:2px; width:14px; }
  #hud { position:fixed; left:calc(12px + env(safe-area-inset-left)); top:calc(10px + env(safe-area-inset-top)); padding:6px 12px; border-radius:20px; background:rgba(16,18,26,.62); pointer-events:none; font-weight:600; }
  #hint { position:fixed; left:50%; transform:translateX(-50%); top:calc(10px + env(safe-area-inset-top)); padding:6px 14px; border-radius:20px; background:rgba(90,200,160,.9); color:#07261b; font-weight:600; display:none; pointer-events:none; max-width:70vw; text-align:center; }
  .bar { position:fixed; display:flex; gap:10px; }
  #topR { right:calc(12px + env(safe-area-inset-right)); top:calc(10px + env(safe-area-inset-top)); }
  #botR { right:calc(14px + env(safe-area-inset-right)); bottom:calc(16px + env(safe-area-inset-bottom)); flex-direction:column; align-items:flex-end; }
  button, .btn { font:inherit; color:var(--fg); background:var(--panel2); border:1px solid rgba(255,255,255,.14); border-radius:14px; padding:0 16px; min-height:48px; min-width:48px; }
  button:active { filter:brightness(1.25); }
  button.pri { background:var(--acc); color:#07261b; border-color:transparent; font-weight:700; }
  button.danger { background:#4a2326; border-color:#7a3a3f; color:#ffb9b0; }
  button.on { outline:2px solid var(--gold); }
  button:disabled { opacity:.4; }
  .label { position:fixed; transform:translate(-50%,-100%); padding:3px 10px; border-radius:12px; background:rgba(16,18,26,.78); border:1px solid rgba(255,255,255,.2); font-weight:600; white-space:nowrap; pointer-events:none; }
  .label.prio { border-color:var(--gold); color:#ffe3a0; }
  #modalRoot { position:fixed; inset:0; z-index:20; display:none; background:rgba(5,6,10,.62); align-items:center; justify-content:center; padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom)); }
  #modalRoot.open { display:flex; }
  .sheet { width:min(520px,100%); max-height:100%; overflow:auto; background:var(--panel); border-radius:18px; padding:18px; border:1px solid rgba(255,255,255,.1); user-select:text; -webkit-user-select:text; }
  .sheet h2 { margin:0 0 12px; font-size:18px; }
  .row { display:flex; gap:10px; align-items:center; margin:10px 0; flex-wrap:wrap; }
  .row > label { flex:0 0 76px; color:var(--dim); }
  .row > .grow { flex:1; min-width:0; }
  input[type=text],input[type=number],textarea,select { width:100%; font:inherit; color:var(--fg); background:var(--panel2); border:1px solid rgba(255,255,255,.14); border-radius:10px; padding:10px 12px; min-height:44px; }
  textarea { min-height:96px; resize:vertical; }
  input[type=range] { width:100%; height:36px; accent-color:var(--acc); }
  input[type=color] { width:56px; height:44px; padding:2px; background:var(--panel2); border:1px solid rgba(255,255,255,.14); border-radius:10px; }
  .actions { display:flex; gap:10px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { min-height:40px; padding:0 14px; border-radius:20px; }
  .note { color:var(--dim); font-size:13px; }
  .detail { white-space:pre-wrap; word-break:break-word; margin:8px 0 12px; }
  .detail img { max-width:100%; border-radius:10px; display:block; margin:8px 0; }
  .detail audio { width:100%; margin:8px 0; }
  #cutPanel { position:fixed; right:calc(10px + env(safe-area-inset-right)); bottom:calc(10px + env(safe-area-inset-bottom)); width:min(300px,46vw); max-height:calc(100% - 76px - env(safe-area-inset-top)); overflow:auto; background:rgba(27,31,44,.96); border:1px solid rgba(255,255,255,.14); border-radius:18px; padding:12px; display:none; z-index:10; }
  #cutPanel .row { margin:6px 0; } #cutPanel .row > label { flex:0 0 auto; }
  #lobby { position:fixed; inset:0; z-index:15; display:none; background:rgba(10,12,18,.96); overflow:auto; padding:calc(14px + env(safe-area-inset-top)) 14px 24px; }
  #lobby.open { display:block; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .card { background:var(--panel); border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:10px; text-align:left; display:block; min-height:0; }
  .card.cur { border-color:var(--acc); }
  .card canvas { width:100%; height:auto; display:block; border-radius:8px; background:#0c0e15; }
  .card b { display:block; margin-top:6px; } .card span { color:var(--dim); font-size:13px; }
  #toast { position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:rgba(0,0,0,.85); padding:10px 16px; border-radius:14px; z-index:30; display:none; max-width:86vw; text-align:center; }
  #boot { position:fixed; inset:0; z-index:40; background:var(--bg); display:flex; align-items:center; justify-content:center; font-size:18px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="touch"></div>
<div id="joyBase"><div id="joyKnob"></div></div>
<div id="cross"></div>
<div id="hud">…</div>
<div id="hint"></div>
<div class="bar" id="topR">
  <button id="btnLobby">🧭 鳥瞰大廳</button>
  <button id="btnMenu" aria-label="選單">☰</button>
</div>
<div class="bar" id="botR">
  <button id="btnCut">✂ 切開</button>
  <button id="btnPlace" class="pri">＋ 放置記憶</button>
</div>
<div id="cutPanel"></div>
<div id="lobby"></div>
<div id="modalRoot"></div>
<div id="toast"></div>
<div id="boot">載入中…</div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module" src="./main.js"></script>
</body>
</html>
